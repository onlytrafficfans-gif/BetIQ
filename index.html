<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BetIQ — Market intelligence</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="styles.css" />

  <body>
    <div class="app-shell">

        <div class="brand"><span class="brand-mark">B</span><span>bet<span>iq</span></span></div>

      <main>
        <header class="topbar"><div><span class="eyebrow">MONDAY · OCT 26, 2026</span><h1 id="page-title">Decision dashboard</h1></div><div class="top-actions"><div class="sync"><span class="pulse"></span> Data synced 2m ago</div><button class="icon-btn">⌕</button><button class="profile-btn">JD</button></div></header>
